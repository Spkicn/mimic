name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skill layout and frontmatter
        run: node scripts/validate.mjs
      - name: Test the validator against its fixtures
        run: node scripts/validate.test.mjs
      - name: Check the routing layer
        run: node scripts/eval-routing.mjs
      - name: Check the scripts parse
        run: |
          node --check scripts/validate.mjs
          node --check scripts/eval-routing.mjs
          node --check skills/mimic/scripts/mimic-probe.mjs
      - name: Check the installers are syntactically valid
        run: |
          sh -n install.sh
          bash -n install.sh
